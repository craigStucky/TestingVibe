<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Steady Strength</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e3e1da;
  --accent: #1f6f5c; --accent-ink: #ffffff; --soft: #e6f1ed; --warn: #b5541c; --warn-soft: #fbeee5;
  --good: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1b201e; --ink: #e8ece9; --muted: #9aa5a0; --line: #2c3330;
    --accent: #5cc3a5; --accent-ink: #0c1a15; --soft: #1e2e29; --warn: #f0a070; --warn-soft: #3a2a20;
    --good: #7cc87f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121614; --card: #1b201e; --ink: #e8ece9; --muted: #9aa5a0; --line: #2c3330;
    --accent: #5cc3a5; --accent-ink: #0c1a15; --soft: #1e2e29; --warn: #f0a070; --warn-soft: #3a2a20;
    --good: #7cc87f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 140px; letter-spacing: .01em; word-spacing: .04em;
}
header { padding-block: 18px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 680px; margin: 0 auto; }
header h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.01em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
main { max-width: 680px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 10;
}
nav button {
  flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 4px 12px;
  font: inherit; font-size: .8rem; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav button span { font-size: 1.25rem; line-height: 1; }
nav button.on { color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
.card h3 { margin: 0; font-size: 1rem; }
.muted { color: var(--muted); }
.small { font-size: .94rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--accent); font-size: .8rem; font-weight: 600; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.note { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: .92rem; margin: 10px 0; }
.note.warn { background: var(--warn-soft); }
button.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
  padding: 9px 14px; font: inherit; font-size: .95rem; cursor: pointer;
}
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.btn.big { width: 100%; padding: 14px; font-size: 1.05rem; }
button.btn.tiny { padding: 4px 10px; font-size: .82rem; }
button.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
details summary { cursor: pointer; color: var(--accent); font-size: .9rem; margin-top: 6px; }
details ul, .card ul { margin: 6px 0; padding-left: 20px; }
details li { margin: 2px 0; }
.sets { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; margin-top: 10px; }
.sets.noweight { grid-template-columns: auto 1fr; }
.sets label { font-size: .78rem; color: var(--muted); }
input[type=number], textarea, input[type=text] {
  width: 100%; font: inherit; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink);
}
textarea { min-height: 70px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.check.done .t { text-decoration: line-through; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 1.4rem; }
.stat span { font-size: .78rem; color: var(--muted); }
svg.spark { width: 100%; height: 56px; display: block; }
.hist { border-bottom: 1px solid var(--line); padding: 8px 0; }
.hist:last-child { border-bottom: 0; }
#timer {
  position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 9; display: flex; justify-content: center;
  pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#timer .box {
  pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 6px 8px 6px 14px;
  display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 100%; flex-wrap: wrap;
}
#timer .t { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 46px; }
#timer button { border: 0; border-radius: 99px; padding: 6px 10px; font: inherit; font-size: .82rem; background: rgba(127,127,127,.25); color: inherit; }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px);
  box-shadow: 0 4px 16px rgba(0,0,0,.2); white-space: pre-line; }
#ask { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
#ask .card { max-width: 380px; width: 100%; }
#sync:empty { display: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#flow { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#flow .inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; text-align: center; }
#flow h2 { margin: 0; font-size: 1.6rem; text-wrap: balance; }
#flow .sk { color: var(--muted); font-size: .95rem; margin-top: -10px; }
.breath { width: 130px; height: 130px; margin: 6px auto; border-radius: 50%; background: var(--soft); border: 3px solid var(--accent);
  display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em;
  transform: scale(.75); transition-property: transform; transition-timing-function: ease-in-out; }
.breath.in { transform: scale(1); }
.fbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fbar i { display: block; height: 100%; background: var(--accent); }
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .breath { transition: none !important; } }
.info { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent);
  font: 700 1rem/1 Georgia, "Times New Roman", serif; cursor: pointer; }
.info[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.tips { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: .94rem; }
.tips ul, .tips ol { margin: 4px 0; padding-left: 20px; }
.tips li { margin: 4px 0; }
.lvl { font-weight: 600; }
.feel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>Steady Strength</h1>
  <p id="sync" class="small"></p>
</header>
<main id="app"></main>
<div id="toast" hidden></div>
<div id="flow" hidden><div class="inner">
  <div class="spread small"><span id="fSet"></span><span id="fCount"></span></div>
  <div class="fbar"><i id="fBar"></i></div>
  <div class="breath" id="fBreath"></div>
  <h2 id="fName"></h2>
  <div class="sk" id="fSk"></div>
  <div class="row" style="justify-content:center"><button class="info" id="fInfo" aria-expanded="false" aria-label="Show tips">i</button></div>
  <p id="fCue" style="margin:0" hidden></p>
  <div class="row" style="justify-content:center">
    <button class="btn" id="fPrev">Back</button><button class="btn primary" id="fPlay">Pause</button><button class="btn" id="fNext">Next</button>
  </div>
  <div class="row small" style="justify-content:center"><span class="muted">Pace</span><button class="btn tiny" id="fSlow">Slower</button><b id="fPace"></b><button class="btn tiny" id="fFast">Faster</button></div>
  <button class="btn" id="fClose">Finish</button>
  <div class="muted small">Shoulder pinch? Rest in child's pose.</div>
</div></div>
<div id="ask" hidden><div class="card"><p id="askMsg" style="margin-top:0"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="askNo">Cancel</button><button class="btn primary" id="askYes">Yes</button></div></div></div>

<div id="timer"><div class="box">
  <span class="t" id="tDisplay">0:00</span>
  <button data-t="30">30s</button><button data-t="60">60s</button><button data-t="90">90s</button>
  <button id="tStop">Stop</button>
</div></div>

<nav>
  <button data-tab="today"><span>●</span>Workout</button>
  <button data-tab="desk"><span>◐</span>Desk break</button>
  <button data-tab="progress"><span>▲</span>Progress</button>
  <button data-tab="plan"><span>☰</span>Plan</button>
</nav>

<script>
// ---------- Program ----------
const EX = {
  ringrow: {
    name: "Ring row", unit: "reps", range: [6, 12], why: "Strengthens the upper back that desk work weakens.",
    cues: ["Squeeze shoulder blades back and down before you bend your arms", "Body in a straight line, ribs down", "Pull rings to your lower ribs, 2 seconds on the way down", "Shoulders stay away from your ears"],
    levels: ["Steep (almost standing upright)", "Medium (body about 45°)", "Low (body near flat, knees bent)", "Low, legs straight", "Feet raised on a chair"]
  },
  squat: {
    name: "Squat", unit: "reps", range: [8, 12], weight: true, why: "Legs and hips, which sitting makes stiff.",
    cues: ["Feet shoulder-width, toes slightly out", "Sit down and back, knees follow toes", "Chest tall, weight held at your chest", "Stand up by pushing the floor away"],
    levels: ["Bodyweight squat to a chair", "Goblet squat to a chair", "Goblet squat, full depth", "Goblet squat, 3-second lower", "Goblet squat with a pause at the bottom"]
  },
  pushup: {
    name: "Push-up", unit: "reps", range: [5, 12], why: "Chest and arms, kept gentle on the shoulder.",
    cues: ["Hands under shoulders, elbows about 45° from your body (not flared)", "Body in one line", "At the top, push the floor away so shoulder blades spread", "Stop if you feel a pinch at the front of the shoulder"],
    levels: ["Wall push-up", "Kitchen counter push-up", "Low incline (sturdy chair or step)", "Floor push-up", "Floor push-up, 3-second lower"]
  },
  bridge: {
    name: "Glute bridge", unit: "reps", range: [10, 15], why: "Wakes up hips that switch off from sitting.",
    cues: ["Lie on back, feet flat near your hips", "Press through heels, squeeze glutes, lift hips", "Don't arch your lower back; ribs stay down"],
    levels: ["Two legs", "Two legs, 3-second hold at top", "Two legs, weight on hips", "Single leg"]
  },
  deadbug: {
    name: "Dead bug", unit: "reps", range: [5, 10], perSide: true, why: "Core control that protects the lower back.",
    cues: ["Lie on back, arms up, knees over hips", "Press lower back gently into the mat the whole time", "Slowly lower opposite arm and leg, breathe out"],
    levels: ["Legs only (arms stay up)", "Opposite arm + bent leg", "Opposite arm + straighter leg", "Holding the weight in both hands"]
  },
  row1: {
    name: "One-arm row", unit: "reps", range: [8, 12], weight: true, perSide: true, why: "More upper-back work, one side at a time.",
    cues: ["Hand and knee on a chair or bench, back flat", "Pull elbow toward your hip, not your ear", "Don't shrug; neck stays relaxed"],
    levels: ["Supported row", "Supported row, 2-second squeeze at top", "Supported row, 3-second lower"]
  },
  hinge: {
    name: "Hip hinge", unit: "reps", range: [8, 12], weight: true, why: "Back of the legs and safe lifting pattern.",
    cues: ["Soft knees, push hips back like closing a car door with your butt", "Back flat, weight close to your legs", "Stand up by squeezing glutes"],
    levels: ["Hinge to a wall, no weight", "Two-hand weight deadlift (Romanian)", "Single-leg deadlift, hand on wall", "Single-leg deadlift, free"]
  },
  facepull: {
    name: "Ring face pull", unit: "reps", range: [8, 12], why: "Directly trains the muscles that hold shoulders back.",
    cues: ["Rings at about chest height, lean back slightly", "Pull hands toward your forehead, elbows out at shoulder height", "Finish with thumbs pointing back, squeeze 1 second", "Use a very steep angle; this should feel easy-ish"],
    levels: ["Very steep (almost standing)", "Steep", "Medium lean"]
  },
  split: {
    name: "Split squat", unit: "reps", range: [6, 10], perSide: true, why: "Balance and single-leg strength.",
    cues: ["Long stance, back heel up", "Drop straight down, front knee over mid-foot", "Torso tall"],
    levels: ["Holding a wall or chair", "No support", "Reverse lunge", "Reverse lunge holding the weight"]
  },
  yt: {
    name: "Prone Y-T raise", unit: "reps", range: [6, 10], why: "Lower-trap work that helps stop shoulders hiking up.",
    cues: ["Face down on the mat, forehead on a towel", "Thumbs up, lift arms by pulling shoulder blades down and back", "Small lift is fine; no neck tension"],
    levels: ["T raise (arms out to sides)", "Y raise (arms overhead in a Y)", "Alternate Y and T", "Y-T with 2-second hold"]
  },
  sideplank: {
    name: "Side plank", unit: "secs", range: [15, 40], perSide: true, why: "Side core; good for posture.",
    cues: ["Elbow under shoulder", "Hips up, body straight", "Breathe normally"],
    levels: ["From knees", "Feet staggered", "Feet stacked"]
  },
  rope: {
    name: "Jump rope finisher", unit: "rounds", single: true, why: "Easy conditioning. Stay light on your feet.",
    cues: ["Small, quiet hops on the balls of your feet", "Wrists turn the rope, elbows stay close", "No rope? Do the same timing with a light bounce or marching"],
    levels: ["5 rounds: 20s on / 40s rest", "6 rounds: 30s on / 30s rest", "8 rounds: 30s on / 30s rest", "5 rounds: 60s on / 30s rest", "3 rounds: 2 min on / 1 min rest"],
    targets: [5, 6, 8, 5, 3]
  }
};

EX.sunsal = {
  name: "Sun salutation", unit: "sets", single: true, why: "A full-body vinyasa flow. One set = 24 poses: 12 leading with the right leg, then 12 with the left. Move with your breath.",
  cues: ["Inhale as you open or lift, exhale as you fold or lower", "Keep shoulders down, away from your ears, in every pose", "Bend your knees in forward folds and downward dog as much as you like", "Knees-chest-chin and low cobra are the shoulder-friendly choices; use them until your shoulder is happy"],
  levels: ["Knees down for plank, knees-chest-chin, low cobra", "Same, more sets", "Same, more sets", "Full plank, knees-chest-chin, cobra", "Full plank, knees-chest-chin, cobra, more sets", "Chaturanga (knees down) and upward dog"],
  targets: [2, 3, 5, 5, 8, 8]
};
// One side of a sun salutation. {lead} is the leg that steps back first. "mod" = shoulder-friendly version (levels 1-3).
const SUN = [
  { n: "Prayer pose", sk: "Pranamasana", b: "exhale", c: "Stand tall, feet together, palms together at your chest." },
  { n: "Raised arms", sk: "Hasta Uttanasana", b: "inhale", c: "Reach up and slightly back. Only a gentle arch; shoulders stay low." },
  { n: "Standing forward fold", sk: "Uttanasana", b: "exhale", c: "Hinge at the hips and fold. Bend your knees so your hands reach the floor." },
  { n: "Low lunge", sk: "Ashwa Sanchalanasana", b: "inhale", c: "Step your {lead} leg back, knee down. Lift your chest and look forward." },
  { n: "Plank", sk: "Phalakasana", b: "hold", c: "Step the other foot back. Hands under shoulders, push the floor away.", mod: "Step the other foot back and lower both knees. Hands under shoulders, push the floor away." },
  { n: "Knees, chest, chin", sk: "Ashtanga Namaskara", b: "exhale", c: "Knees down, then chest and chin to the floor, hips up. Elbows hug your ribs.", hard: { n: "Chaturanga", sk: "Chaturanga Dandasana", c: "Knees down, lower halfway with elbows hugging your ribs, then to the floor." } },
  { n: "Cobra", sk: "Bhujangasana", b: "inhale", c: "Lift your chest with your back muscles. Elbows bent, shoulders down.", mod: "Low cobra: lift your chest a few inches with your back, barely pressing your hands.", hard: { n: "Upward dog", sk: "Urdhva Mukha Svanasana", c: "Press up, thighs lifted, shoulders down and back. Skip it if the shoulder pinches." } },
  { n: "Downward dog", sk: "Adho Mukha Svanasana", b: "exhale", c: "Tuck toes, lift hips up and back. Bend your knees; hands a bit wider than shoulders is fine." },
  { n: "Low lunge", sk: "Ashwa Sanchalanasana", b: "inhale", c: "Step your {lead} foot forward between your hands, back knee down. Lift your chest." },
  { n: "Standing forward fold", sk: "Uttanasana", b: "exhale", c: "Step the back foot forward and fold. Soft knees." },
  { n: "Raised arms", sk: "Hasta Uttanasana", b: "inhale", c: "Rise up slowly with a flat back and reach up." },
  { n: "Prayer pose", sk: "Pranamasana", b: "exhale", c: "Hands back to your chest. One breath here before the next side." }
];
function sunPoses(L) {
  const out = [];
  ["right", "left"].forEach(lead => SUN.forEach(p => {
    let n = p.n, sk = p.sk, c = p.c;
    if (L <= 2 && p.mod) c = p.mod;
    if (L >= 5 && p.hard) ({ n, sk, c } = p.hard);
    out.push({ n, sk, b: p.b, c: c.replace("{lead}", lead), lead });
  }));
  return out;
}

const WORKOUTS = {
  A: { name: "Workout A", focus: "Rows, squats, push-ups, core", list: ["ringrow", "squat", "pushup", "bridge", "deadbug", "rope"] },
  B: { name: "Workout B", focus: "Back, hips, shoulder health, core", list: ["row1", "hinge", "facepull", "split", "yt", "sideplank", "rope"] },
  C: { name: "Flow day", short: "Flow", focus: "Sun salutations. Gentle enough for rest days", list: ["sunsal"], mins: "~10–20 min" }
};
WORKOUTS.A.short = "A"; WORKOUTS.B.short = "B";
const FLOW_WARM = ["Neck half-circles, 5 each way", "Wrist circles, 10 each way", "Cat-cow, 8 slow reps", "Child's pose, 5 breaths"];
const FLOW_COOL = ["Seated forward fold, 5 breaths", "Lying twist, 5 breaths each side", "Lie still on your back (savasana), 1–2 minutes"];

const WARMUP = [
  "2 min easy rope skipping or marching in place",
  "Arm circles, 10 forward + 10 back (small to big)",
  "Cat-cow on the mat, 8 slow reps",
  "Wall slides, 8 reps (back to wall, slide arms up and down)",
  "Shoulder blade squeezes, 10 reps",
  "Bodyweight squats, 8 reps"
];
const COOLDOWN = [
  "Doorway chest stretch, 30s each side",
  "Upper trap stretch (ear to shoulder), 30s each side",
  "Child's pose, 45s, breathe slowly",
  "Open book on your side, 5 each side"
];
const DESK = [
  ["Chin tucks", "10×", "Slide your head straight back to make a double chin. Hold 2 seconds."],
  ["Shoulder rolls", "10×", "Slow rolls, backwards."],
  ["Shoulder squeeze", "10×", "Squeeze shoulder blades down and back. Hold 3 seconds."],
  ["Shrug and drop", "5×", "Shrug hard for 3 seconds, then let go completely."],
  ["Neck stretch", "30s each side", "Ear toward shoulder. Opposite hand reaches down."],
  ["Doorway stretch", "30s", "Forearms on the door frame. Lean gently through."],
  ["Back bend in chair", "5×", "Hands behind head. Lean back over the top of the chair."],
  ["Stand and reach", "5 breaths", "Stand up, arms overhead, reach tall."]
];

// ---------- Storage ----------
const KEY = "steady-strength-v1";
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sessions) return s; } catch (e) {}
  return { sessions: [], levels: {}, desk: {}, draft: null };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// In-page messages (the viewer blocks alert/confirm)
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4000); }
function ask(msg) {
  return new Promise(res => {
    const box = $("#ask"); $("#askMsg").textContent = msg; box.hidden = false;
    const done = v => { box.hidden = true; $("#askYes").onclick = $("#askNo").onclick = null; res(v); };
    $("#askYes").onclick = () => done(true); $("#askNo").onclick = () => done(false);
  });
}

// ---------- Cloud save (when opened as a Claude artifact) ----------
// Each person's data lives in their own private folder: data/users/<id>/ (meta doc + one doc per workout).
const Cloud = { col: null, metaQ: Promise.resolve() };
function setSync(msg) { $("#sync").textContent = msg; $("#sync").className = "small" + (msg ? " muted" : ""); }
function cloudMeta() {
  if (!Cloud.col) return;
  const body = { levels: { ...S.levels }, desk: { ...S.desk } };
  Cloud.metaQ = Cloud.metaQ.then(() => Cloud.col.doc("meta").set(body)).catch(() => setSync("Couldn't save to your account. Kept on this device."));
}
function cloudSession(s) { if (Cloud.col) Cloud.col.doc("s_" + s.id).set(JSON.parse(JSON.stringify(s))).catch(() => toast("Couldn't save to your account. Kept on this device.")); }
function cloudDelete(id) { if (Cloud.col) Cloud.col.doc("s_" + id).delete().catch(() => {}); }
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync("Saving on this device only. Sign in to keep your log across devices."); return; }
  Cloud.col = db.collection("data/users/" + uid);
  setSync("Loading your log...");
  let first = true;
  const timer = setTimeout(() => setSync("Can't reach your saved log yet. Changes are kept on this device for now."), 10000);
  Cloud.col.onSnapshot(snap => {
    if (snap.metadata.fromCache) return;
    clearTimeout(timer); setSync("");
    const sessions = []; let meta = null;
    snap.docs.forEach(d => { if (d.id === "meta") meta = d.data(); else if (d.id.startsWith("s_")) sessions.push(JSON.parse(JSON.stringify(d.data()))); });
    if (first) {
      first = false;
      // First visit with the cloud: move anything logged on this device up.
      if (!sessions.length && !meta && S.sessions.length) { S.sessions.forEach(cloudSession); cloudMeta(); return; }
    }
    S.sessions = sessions.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    if (meta) { S.levels = { ...(meta.levels || {}) }; S.desk = { ...(meta.desk || {}) }; }
    save();
    const a = document.activeElement;
    if (!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"))) render();
  }, () => { clearTimeout(timer); setSync("Saving on this device only."); });
}

// ---------- Helpers ----------
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dayDiff = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const fmtDate = d => new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const lvl = id => Math.min(S.levels[id] || 0, EX[id].levels.length - 1);
const lastSession = () => S.sessions[S.sessions.length - 1];
const lastStrength = () => { for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].type !== "C") return S.sessions[i]; return null; };
const nextType = () => { const l = lastStrength(); return l && l.type === "A" ? "B" : "A"; };
function weekNumber() {
  if (!S.sessions.length) return 1;
  return Math.floor(dayDiff(S.sessions[0].date, todayStr()) / 7) + 1;
}
function setsFor(id) {
  if (EX[id].single) return 1;
  return weekNumber() <= 2 ? 2 : 3;
}
function targetRange(id) {
  const e = EX[id];
  if (e.targets) { const t = e.targets[lvl(id)]; return [t, t]; }
  return e.range;
}
function unitLabel(id) {
  const e = EX[id];
  if (e.unit === "secs") return "seconds" + (e.perSide ? " / side" : "");
  if (e.unit === "rounds") return "rounds done";
  return "reps" + (e.perSide ? " / side" : "");
}
function lastEntry(id) {
  for (let i = S.sessions.length - 1; i >= 0; i--) { const en = S.sessions[i].entries[id]; if (en) return { s: S.sessions[i], en }; }
  return null;
}
// Ready to level up: last time at this level, every set hit the top of the range, no "hard", low shoulder discomfort.
function readyToLevelUp(id) {
  const l = lastEntry(id); if (!l) return false;
  if (l.en.level !== lvl(id) || lvl(id) >= EX[id].levels.length - 1) return false;
  const hi = targetRange(id)[1];
  const sets = l.en.sets.filter(x => x.reps !== "" && x.reps != null);
  if (!sets.length || sets.length < (EX[id].single ? 1 : 2)) return false;
  return sets.every(x => Number(x.reps) >= hi) && l.s.feel !== "hard" && (l.s.pain || 0) <= 2;
}
function volume(en) { return en.sets.reduce((a, x) => a + (Number(x.reps) || 0), 0); }

// ---------- Draft (in-progress workout) ----------
function freshDraft(type) {
  const entries = {};
  WORKOUTS[type].list.forEach(id => {
    entries[id] = { level: lvl(id), sets: Array.from({ length: setsFor(id) }, () => ({ reps: "", weight: "" })) };
  });
  return { type, date: todayStr(), entries, feel: "", pain: 0, notes: "", warm: [], cool: [] };
}
function getDraft() {
  if (!S.draft || S.draft.date !== todayStr()) { S.draft = freshDraft(nextType()); save(); }
  return S.draft;
}

// ---------- Info (ⓘ) toggles ----------
const OPEN = new Set();
const infoBtn = key => `<button class="info" data-info="${key}" aria-expanded="${OPEN.has(key)}" aria-label="Show tips">i</button>`;
const tips = (key, html) => `<div class="tips" id="tip-${key}" ${OPEN.has(key) ? "" : "hidden"}>${html}</div>`;

function render() {

function checklistCard(title, items, key, d) {
  return `<div class="card"><details>
    <summary style="margin:0;font-size:1rem;color:var(--ink);font-weight:600">${title} <span class="muted small">${d[key].length}/${items.length}</span></summary>
    <div style="margin-top:6px">${items.map((t, i) => `<label class="check ${d[key].includes(i) ? "done" : ""}"><input type="checkbox" data-list="${key}" data-i="${i}" ${d[key].includes(i) ? "checked" : ""}><span class="t">${esc(t)}</span></label>`).join("")}</div>
  </details></div>`;
}

function exerciseCard(id, d) {
  const e = EX[id], en = d.entries[id], L = en.level;
  const [lo, hi] = e.targets ? [e.targets[L], e.targets[L]] : e.range;
  const prev = lastEntry(id);
  const up = readyToLevelUp(id) && L === lvl(id);
  const side = e.perSide ? " each side" : "";
  const target = e.single ? (e.unit === "sets" ? `${lo} sets` : `${lo} rounds`) : `${en.sets.length} × ${lo === hi ? lo : lo + "–" + hi} ${e.unit === "secs" ? "sec" : "reps"}${side}`;
  const rows = en.sets.map((s, i) => `
    <span class="small muted">${e.single ? "Done" : "Set " + (i + 1)}</span>
    <input type="number" inputmode="numeric" min="0" placeholder="${e.single ? e.unit : prev && prev.en.sets[i] ? prev.en.sets[i].reps : e.unit}" data-ex="${id}" data-i="${i}" data-f="reps" value="${esc(s.reps)}" aria-label="${e.name} set ${i + 1}">
    ${e.weight ? `<input type="number" inputmode="decimal" min="0" placeholder="lb" data-ex="${id}" data-i="${i}" data-f="weight" value="${esc(s.weight)}" aria-label="${e.name} set ${i + 1} weight">` : ""}
  `).join("");
  const tipHtml = `<ul>${e.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      ${id === "sunsal" ? `<b>The 12 poses</b>, then repeat on the other leg:<ol>${sunPoses(L).slice(0, 12).map(p => `<li>${esc(p.n)} <span class="muted">· ${p.b}</span></li>`).join("")}</ol>` : ""}
      ${prev ? `<div class="muted">Last time (${fmtDate(prev.s.date)}): ${prev.en.sets.map(x => (x.reps || "–") + (x.weight ? " @ " + x.weight + " lb" : "")).join(", ")}</div>` : ""}
      ${e.single ? "" : `<div class="row" style="margin-top:8px"><button class="btn tiny" data-addset="${id}">Add a set</button>${en.sets.length > 1 ? `<button class="btn tiny" data-rmset="${id}">Remove a set</button>` : ""}</div>`}`;
  return `<div class="card">
    <div class="spread">
      <div style="min-width:0"><h3>${e.name}</h3><div class="small lvl">${esc(e.levels[L])}</div></div>
      ${infoBtn("ex-" + id)}
    </div>
    <div class="row" style="margin-top:8px">
      <span class="pill">${target}</span>
      ${up ? `<span class="pill" style="background:var(--accent);color:var(--accent-ink)">Level up ↑</span>` : ""}
      <span style="flex:1"></span>
      <button class="btn tiny" data-lvl="${id}" data-d="-1" ${L === 0 ? "disabled" : ""} aria-label="Easier version">Easier</button>
      <button class="btn tiny" data-lvl="${id}" data-d="1" ${L >= e.levels.length - 1 ? "disabled" : ""} aria-label="Harder version">Harder</button>
    </div>
    ${tips("ex-" + id, tipHtml)}
    ${id === "sunsal" ? `<button class="btn primary" style="width:100%;margin-top:10px" data-act="guide">Start guided flow</button>` : ""}
    <div class="sets ${e.weight ? "" : "noweight"}">${rows}</div>
  </div>`;
}

function viewDesk() {

function spark(values, max) {
  if (values.length < 2) return `<div class="muted small">Log a couple more sessions to see a trend.</div>`;
  const W = 300, H = 56, P = 4;
  const m = max ?? Math.max(...values, 1);
  const pts = values.map((v, i) => [P + i * (W - 2 * P) / (values.length - 1), H - P - (v / m) * (H - 2 * P)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${pts.map(p => p.join(",")).join(" ")}"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join("")}</svg>`;
}

function viewProgress() {
  const ss = S.sessions, t = todayStr();
  const strength = ss.filter(s => s.type !== "C");
  const thisWeek = strength.filter(s => dayDiff(s.date, t) < 7).length;
  const flowSets = ss.filter(s => s.type === "C" && dayDiff(s.date, t) < 7).reduce((a, s) => a + (s.entries.sunsal ? volume(s.entries.sunsal) : 0), 0);
  const recentPain = ss.slice(-5);
  const avgPain = recentPain.length ? (recentPain.reduce((a, s) => a + (s.pain || 0), 0) / recentPain.length).toFixed(1) : "–";
  // sessions per week, last 8 weeks
  const weeks = Array.from({ length: 8 }, (_, i) => strength.filter(s => { const dd = dayDiff(s.date, t); return dd >= (7 - i) * 7 && dd < (8 - i) * 7; }).length);
  const bars = `<svg viewBox="0 0 300 70" style="width:100%;height:70px">${weeks.map((n, i) => `<rect x="${i * 37 + 4}" y="${60 - Math.min(n, 4) * 13}" width="28" height="${Math.min(n, 4) * 13 || 1}" rx="4" fill="${n >= 3 ? "var(--accent)" : "var(--muted)"}" opacity="${n ? 1 : .3}"/><text x="${i * 37 + 18}" y="69" font-size="8" text-anchor="middle" fill="var(--muted)">${i === 7 ? "now" : (7 - i) + "w"}</text>`).join("")}</svg>`;

  const allIds = [...new Set([...WORKOUTS.A.list, ...WORKOUTS.B.list, ...WORKOUTS.C.list])];
  const exRows = allIds.map(id => {
    const vals = ss.filter(s => s.entries[id]).slice(-12).map(s => volume(s.entries[id]) + s.entries[id].level * 20);
    const l = lastEntry(id);
    return `<div class="hist"><div class="spread"><div><b>${EX[id].name}</b><div class="small muted">Level ${lvl(id) + 1}/${EX[id].levels.length}: ${esc(EX[id].levels[lvl(id)])}</div></div>${readyToLevelUp(id) ? `<span class="pill">level up</span>` : ""}</div>
      <div class="small muted">${l ? "Last: " + l.en.sets.map(x => (x.reps || "–") + (x.weight ? "@" + x.weight : "")).join(", ") : "Not done yet"}</div>
      ${vals.length >= 2 ? spark(vals) : ""}</div>`;
  }).join("");

  const deskDays = Object.keys(S.desk).filter(k => dayDiff(k, t) < 7);
  const deskWeek = deskDays.reduce((a, k) => a + S.desk[k], 0);

  return `
    <div class="stats">
      <div class="stat"><b>${strength.length}</b><span>strength workouts total</span></div>
      <div class="stat"><b>${thisWeek}</b><span>strength, last 7 days (goal 3)</span></div>
      <div class="stat"><b>${flowSets}</b><span>sun salutation sets, 7 days</span></div>
      <div class="stat"><b>${deskWeek}</b><span>desk breaks, 7 days</span></div>
    </div>
    <div class="card"><h3>Strength workouts per week</h3><div class="muted small">Green = hit 3 that week. Flow days aren't counted here.</div>${bars}</div>
    <div class="card"><div class="spread"><h3>Shoulder discomfort</h3><span class="pill ${avgPain !== "–" && avgPain > 3 ? "warn" : ""}">avg ${avgPain}</span></div>
      <div class="muted small">Last 5 sessions. Lower is better.</div>${spark(ss.slice(-20).map(s => s.pain || 0), 10)}</div>
    <div class="card"><h3>Exercises</h3><div class="muted small">Trend combines level and reps, so leveling up shows as progress.</div>${exRows}</div>
    <div class="card"><h3>History</h3>${ss.length ? ss.slice().reverse().map(s => `<div class="hist"><div class="spread"><div><b>${fmtDate(s.date)}</b> · ${WORKOUTS[s.type].name}</div><button class="btn tiny" data-del="${s.id}">Delete</button></div>
      <div class="small muted">Felt ${s.feel || "–"} · shoulder ${s.pain || 0}/10</div>${s.notes ? `<div class="small">${esc(s.notes)}</div>` : ""}</div>`).join("") : `<div class="muted small">No workouts yet. Your first one is waiting on the Workout tab.</div>`}</div>
    <div class="card"><h3>Your data</h3><div class="muted small">${Cloud.col ? "Saved privately to your account. Only you can see it." : "Saved only in this browser. Export a backup now and then."}</div>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button><button class="btn" data-act="reset">Reset all</button></div>
      <input type="file" id="importFile" accept="application/json" hidden></div>`;
}

function viewPlan() {
  return `
    <div class="card">
      <h2>The plan</h2>
      <ul class="small">
        <li><b>3 workouts a week</b>, alternating A and B, with a rest day between (e.g. Mon / Wed / Fri). About 30 minutes each.</li>
        <li><b>Desk breaks daily</b>: 4 minutes, a few times a day. This matters as much as the workouts for your shoulder.</li>
        <li><b>Weeks 1–2: 2 sets</b> of each exercise. <b>Week 3 on: 3 sets.</b> The app handles this.</li>
        <li><b>Flow day (sun salutations)</b> on rest days or any morning. It's gentle, so it doesn't break the rest-day rule. Start with 2 sets of 24 poses.</li>
        <li><b>Walk</b> 20–30 minutes on rest days if you can.</li>
      </ul>
    </div>
    <div class="card">
      <h3>How you'll progress</h3>
      <ul class="small">
        <li>Each exercise has levels, from very easy to harder. Start at level 1 even if it feels too easy. The first weeks are about learning the movement and letting joints catch up.</li>
        <li>Add reps within the range each session. When you hit the top of the range on every set, it didn't feel hard, and shoulder discomfort was 2 or less, the app shows <span class="pill">Ready to level up</span>.</li>

        <li>Bad day? Drop a level. That's part of the plan, not a failure.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Shoulder-friendly choices</h3>
      <ul class="small">
        <li>More pulling than pushing (rows, face pulls, Y-T raises) to balance desk posture.</li>

        <li>No ring dips, ring push-ups, ring support holds, or overhead pressing for now. Those can come after 2–3 months of pain-free training.</li>
        <li>Shoulders stay down and away from your ears in every exercise. If you feel your neck working, make it easier.</li>

    <div class="card">

// ---------- Events ----------
function bind() {
  const app = $("#app"), d = S.draft;
  app.querySelectorAll("input[data-ex]").forEach(inp => inp.addEventListener("input", () => {
    d.entries[inp.dataset.ex].sets[inp.dataset.i][inp.dataset.f] = inp.value; save();
  }));
  app.querySelectorAll("[data-lvl]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.lvl, n = Math.max(0, Math.min(EX[id].levels.length - 1, d.entries[id].level + Number(b.dataset.d)));
    d.entries[id].level = n; S.levels[id] = n; save(); cloudMeta(); render();
  }));
  app.querySelectorAll("[data-addset]").forEach(b => b.addEventListener("click", () => { d.entries[b.dataset.addset].sets.push({ reps: "", weight: "" }); save(); render(); }));
  app.querySelectorAll("[data-rmset]").forEach(b => b.addEventListener("click", () => { d.entries[b.dataset.rmset].sets.pop(); save(); render(); }));
  app.querySelectorAll("[data-list]").forEach(c => c.addEventListener("change", () => {
    const arr = d[c.dataset.list], i = Number(c.dataset.i);
    if (c.checked) { if (!arr.includes(i)) arr.push(i); } else arr.splice(arr.indexOf(i), 1);
    c.closest(".check").classList.toggle("done", c.checked);
    const sum = c.closest("details").querySelector("summary .muted"); if (sum) sum.textContent = arr.length + "/" + sum.textContent.split("/")[1];
    save();
  }));
  app.querySelectorAll("[data-feel]").forEach(b => b.addEventListener("click", () => { d.feel = b.dataset.feel; save(); render(); }));
  const pain = $("#pain"); if (pain) pain.addEventListener("input", () => { d.pain = Number(pain.value); $("#painVal").textContent = d.pain + "/10"; save(); });
  const notes = $("#notes"); if (notes) notes.addEventListener("input", () => { d.notes = notes.value; save(); });
  app.querySelectorAll("[data-desk]").forEach(c => c.addEventListener("change", () => {
    const t = todayStr(); if (!S.deskChecks || S.deskChecks.date !== t) S.deskChecks = { date: t, items: [] };
    const i = Number(c.dataset.desk), arr = S.deskChecks.items;
    if (c.checked) { if (!arr.includes(i)) arr.push(i); } else arr.splice(arr.indexOf(i), 1);
    c.closest(".check").classList.toggle("done", c.checked); save();
  }));
  app.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (!(await ask("Delete this workout?"))) return;
    S.sessions = S.sessions.filter(s => s.id !== b.dataset.del); cloudDelete(b.dataset.del); save(); render();
  }));
  app.querySelectorAll("[data-info]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); const k = b.dataset.info, el = document.getElementById("tip-" + k);
    if (OPEN.has(k)) OPEN.delete(k); else OPEN.add(k);
    b.setAttribute("aria-expanded", OPEN.has(k)); if (el) el.hidden = !OPEN.has(k);
  }));
  app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => actions.pick(b.dataset.pick)));
  app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => actions[b.dataset.act]()));
  const f = $("#importFile"); if (f) f.addEventListener("change", () => {
    const file = f.files[0]; if (!file) return;
    file.text().then(txt => { const data = JSON.parse(txt); if (!data.sessions) throw 0; S.sessions.forEach(s => cloudDelete(s.id)); S = { desk: {}, levels: {}, ...data }; save(); S.sessions.forEach(cloudSession); cloudMeta(); render(); toast("Backup imported."); }).catch(() => toast("That file doesn't look like a backup."));
  });
}

const actions = {
  async pick(type) {
    const d = S.draft; if (type === d.type) return;
    if (Object.values(d.entries).some(en => en.sets.some(s => s.reps !== "")) && !(await ask("Switch workouts? Numbers entered so far will be cleared."))) return;
    S.draft = freshDraft(type); save(); render();
  },
  guide() { flowStart(); },
  finish() {
    const d = S.draft;
    const entries = {};
    Object.entries(d.entries).forEach(([id, en]) => {
      const sets = en.sets.filter(s => s.reps !== "");
      if (sets.length) entries[id] = { level: en.level, sets };
    });
    if (!Object.keys(entries).length) { toast("Enter at least one set before saving."); return; }
    const sess = { id: Date.now().toString(36), date: d.date, type: d.type, entries, feel: d.feel, pain: d.pain, notes: d.notes };
    S.sessions.push(sess); cloudSession(sess); cloudMeta();
    S.sessions.sort((a, b) => a.date.localeCompare(b.date));
    S.draft = null; save();
    tab = "progress"; render(); window.scrollTo(0, 0);
    const ups = Object.keys(entries).filter(readyToLevelUp).map(id => EX[id].name);
    toast((d.type === "C" ? "Flow saved." : "Workout saved. Rest tomorrow.") + (ups.length ? "\nReady to level up: " + ups.join(", ") + "." : ""));
  },
  desk() {
    const t = todayStr(); S.desk[t] = (S.desk[t] || 0) + 1; S.deskChecks = { date: t, items: [] }; save(); cloudMeta(); render(); toast("Desk break logged.");
  },
  async export() {
    const json = JSON.stringify({ sessions: S.sessions, levels: S.levels, desk: S.desk }, null, 2), filename = "steady-strength-" + todayStr() + ".json";
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename, data: json }); } catch (e) {} return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = filename; a.click();
  },
  import() { $("#importFile").click(); },
  async reset() {
    if (!(await ask("Delete ALL workouts and settings? Export a backup first if unsure."))) return;
    S.sessions.forEach(s => cloudDelete(s.id)); S = { sessions: [], levels: {}, desk: {}, draft: null }; save(); cloudMeta(); render();
  }
};

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

// ---------- Guided sun salutation ----------
const F = { i: 0, poses: [], timer: null, playing: true, pace: 5 };
try { F.pace = Number(localStorage.getItem(KEY + "-pace")) || 5; } catch (e) {}
function flowStart() {
  const en = S.draft.entries.sunsal; if (!en) return;
  F.poses = sunPoses(en.level); F.i = 0; F.playing = true;
  $("#flow").hidden = false; document.body.style.overflow = "hidden";
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => F.lock = l).catch(() => {}); } catch (e) {}
  flowShow();
}
function flowSetsDone() { return Number(S.draft.entries.sunsal.sets[0].reps) || 0; }
function flowShow() {
  clearTimeout(F.timer);
  const p = F.poses[F.i], en = S.draft.entries.sunsal, target = EX.sunsal.targets[en.level];
  $("#fSet").textContent = "Set " + (flowSetsDone() + 1) + " of " + target;
  $("#fCount").textContent = "Pose " + (F.i + 1) + " / 24 · leading " + p.lead;
  $("#fBar").style.width = ((F.i + 1) / 24 * 100) + "%";
  $("#fName").textContent = p.n; $("#fSk").textContent = p.sk; $("#fCue").textContent = p.c;
  const br = $("#fBreath"); br.textContent = p.b; br.style.transitionDuration = F.pace + "s";
  br.classList.toggle("in", p.b === "inhale" || (p.b === "hold" && F.i > 0 && F.poses[F.i - 1].b === "inhale"));
  $("#fPlay").textContent = F.playing ? "Pause" : "Play";
  $("#fPace").textContent = F.pace + "s / breath";
  if (F.playing) F.timer = setTimeout(() => flowStep(1), F.pace * 1000);
}
function flowStep(dir) {
  if (dir > 0 && F.i === 23) {
    const en = S.draft.entries.sunsal, n = flowSetsDone() + 1, target = EX.sunsal.targets[en.level];
    en.sets[0].reps = String(n); save(); beep();
    if (n >= target) { F.playing = false; flowClose(); toast("All " + target + " sets done. Lovely work."); return; }
    toast("Set " + n + " done. A few easy breaths, then the next one.");
    F.i = 0;
  } else F.i = Math.max(0, Math.min(23, F.i + dir));
  flowShow();
}
function flowClose() { clearTimeout(F.timer); $("#flow").hidden = true; document.body.style.overflow = ""; try { F.lock && F.lock.release(); } catch (e) {} render(); }
$("#fNext").addEventListener("click", () => flowStep(1));
$("#fPrev").addEventListener("click", () => flowStep(-1));
$("#fPlay").addEventListener("click", () => { F.playing = !F.playing; flowShow(); });
$("#fClose").addEventListener("click", flowClose);
try { F.cue = localStorage.getItem(KEY + "-cue") === "1"; } catch (e) {}
function cueShow() { $("#fCue").hidden = !F.cue; $("#fInfo").setAttribute("aria-expanded", !!F.cue); }
cueShow();
$("#fInfo").addEventListener("click", () => { F.cue = !F.cue; try { localStorage.setItem(KEY + "-cue", F.cue ? "1" : "0"); } catch (e) {} cueShow(); });
const setPace = v => { F.pace = Math.max(3, Math.min(10, v)); try { localStorage.setItem(KEY + "-pace", F.pace); } catch (e) {} flowShow(); };
$("#fSlow").addEventListener("click", () => setPace(F.pace + 1));
$("#fFast").addEventListener("click", () => setPace(F.pace - 1));

// ---------- Timer ----------
let tEnd = 0, tInt = null, audio;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(o => { const os = audio.createOscillator(), g = audio.createGain(); os.frequency.value = 880; os.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.2, audio.currentTime + o); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + o + .2); os.start(audio.currentTime + o); os.stop(audio.currentTime + o + .2); });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function tick() {
  const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  $("#tDisplay").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  if (left <= 0) { clearInterval(tInt); tInt = null; beep(); $("#tDisplay").textContent = "Go!"; }
}
document.querySelectorAll("#timer [data-t]").forEach(b => b.addEventListener("click", () => {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  tEnd = Date.now() + Number(b.dataset.t) * 1000; clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}));
$("#tStop").addEventListener("click", () => { clearInterval(tInt); tInt = null; $("#tDisplay").textContent = "0:00"; });

render();
initCloud();
</script>
</body>
</html>
